# Usage : docker compose -f docker-compose.dev.yml up -d
# Démarre uniquement Postgres pour le développement local (l'app tourne via `pnpm dev` sur l'hôte).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dart_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-dart_tournaments}
    volumes:
      - dart_pgdata_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dart_app}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dart_pgdata_dev:
