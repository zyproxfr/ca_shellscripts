name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dart_app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: dart_tournaments
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dart_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dart_app:ci_password@localhost:5432/dart_tournaments?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci_only_secret_not_for_production

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm exec eslint . --max-warnings=0

      - name: Apply database migrations
        run: pnpm prisma:deploy

      - name: Unit tests
        run: pnpm test
